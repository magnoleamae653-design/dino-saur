<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dino Runner</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .game {
      width: min(90vw, 700px);
      padding: 20px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0002;
    }

    canvas {
      width: 100%;
      border: 2px solid #333;
      border-radius: 8px;
      background: #eaf7ff;
      touch-action: manipulation;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>🦖 Dino Runner</h1>
    <p>Jump over the cactus. Tap, press Space, or press ↑.</p>
    <canvas id="gameCanvas" width="700" height="250"></canvas>
    <p id="score">Score: 0</p>
    <button id="restart">Restart</button>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");

    const groundY = 205;
    let dino, cactus, score, gameOver, lastTime;

    function resetGame() {
      dino = { x: 55, y: groundY - 42, width: 38, height: 42, velocityY: 0 };
      cactus = { x: canvas.width + 20, width: 22, height: 42, speed: 5 };
      score = 0;
      gameOver = false;
      lastTime = 0;
      requestAnimationFrame(update);
    }

    function jump() {
      if (!gameOver && dino.y >= groundY - dino.height) {
        dino.velocityY = -12;
      }
    }

    function update(time) {
      if (gameOver) return;

      const delta = Math.min((time - lastTime) / 16.67 || 1, 2);
      lastTime = time;

      dino.velocityY += 0.6 * delta;
      dino.y += dino.velocityY * delta;

      if (dino.y > groundY - dino.height) {
        dino.y = groundY - dino.height;
        dino.velocityY = 0;
      }

      cactus.x -= cactus.speed * delta;

      if (cactus.x + cactus.width < 0) {
        cactus.x = canvas.width + Math.random() * 180;
        score++;
        cactus.speed = Math.min(5 + score * 0.2, 10);
        scoreText.textContent = Score: ${score};
      }

      const hit =
        dino.x + dino.width > cactus.x &&
        dino.x < cactus.x + cactus.width &&
        dino.y + dino.height > groundY - cactus.height;

      if (hit) gameOver = true;

      draw();
      if (gameOver) {
        ctx.fillStyle = "#222";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Game Over!", canvas.width / 2, 100);
        ctx.font = "18px Arial";
        ctx.fillText("Press Restart to play again", canvas.width / 2, 130);
      } else {
        requestAnimationFrame(update);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = "#555";
      ctx.fillRect(0, groundY, canvas.width, 3);

      // Dino
      ctx.fillStyle = "#2e7d32";
      ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
      ctx.fillStyle = "white";
      ctx.fillRect(dino.x + 25, dino.y + 8, 6, 6);

      // Cactus
      ctx.fillStyle = "#16833b";
      ctx.fillRect(cactus.x, groundY - cactus.height, cactus.width, cactus.height);
      ctx.fillRect(cactus.x - 8, groundY - 28, 9, 7);
      ctx.fillRect(cactus.x + 15, groundY - 34, 9, 7);
    }

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        jump();
      }
    });

    canvas.addEventListener("pointerdown", jump);
    document.getElementById("restart").addEventListener("click", resetGame);

    resetGame();
  </script>
</body>
</html>
